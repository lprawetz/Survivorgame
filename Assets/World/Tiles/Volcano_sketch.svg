<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Vulkan – Basalt mit Lava-Rissen -->
  <rect width="64" height="64" fill="#1A1A1A"/>
  <!-- Basalt-Platten -->
  <polygon points="0,0   28,24 0,48"  fill="#222222"/>
  <polygon points="64,0  36,24 64,48" fill="#141414"/>
  <polygon points="0,48  28,40 0,64"  fill="#222222"/>
  <polygon points="64,48 36,40 64,64" fill="#141414"/>
  <!-- Zentrum – erkaltete Lava -->
  <polygon points="28,24 36,24 36,40 28,40" fill="#1E1E1E"/>
  <!-- Lava-Hauptriss (diagonal) -->
  <line x1="0"  y1="64" x2="64" y2="0"  stroke="#FF6600" stroke-width="3"/>
  <line x1="0"  y1="64" x2="64" y2="0"  stroke="#FFAA00" stroke-width="1.5" opacity="0.8"/>
  <line x1="0"  y1="64" x2="64" y2="0"  stroke="#FFDD00" stroke-width="0.5" opacity="0.6"/>
  <!-- Nebenrisse -->
  <line x1="0"  y1="20" x2="28" y2="32" stroke="#FF5500" stroke-width="1.5" opacity="0.9"/>
  <line x1="64" y1="44" x2="36" y2="32" stroke="#FF5500" stroke-width="1.5" opacity="0.9"/>
  <line x1="20" y1="0"  x2="30" y2="24" stroke="#FF4400" stroke-width="1" opacity="0.7"/>
  <line x1="44" y1="64" x2="34" y2="40" stroke="#FF4400" stroke-width="1" opacity="0.7"/>
  <!-- Lava-Glühen um Risse -->
  <line x1="0"  y1="64" x2="64" y2="0" stroke="#FF8800" stroke-width="8" opacity="0.15"/>
  <!-- Asche-Texturflächen -->
  <ellipse cx="12" cy="12" rx="8" ry="6" fill="#111111" opacity="0.8"/>
  <ellipse cx="52" cy="52" rx="8" ry="6" fill="#111111" opacity="0.8"/>
  <!-- Erstarrte Lava-Brocken -->
  <ellipse cx="48" cy="10" rx="6" ry="4" fill="#2A1A00"/>
  <ellipse cx="16" cy="54" rx="5" ry="3" fill="#2A1A00"/>
  <!-- Dampf-Punkte -->
  <circle cx="22" cy="42" r="2" fill="#443322" opacity="0.6"/>
  <circle cx="42" cy="22" r="2" fill="#443322" opacity="0.6"/>
</svg>
