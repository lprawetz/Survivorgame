<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Wald – Baumkronenperspektive von oben -->
  <rect width="64" height="64" fill="#2A5A18"/>
  <!-- Waldboden-Schatten -->
  <rect x="0"  y="0"  width="32" height="32" fill="#1E4210" opacity="0.4"/>
  <rect x="32" y="32" width="32" height="32" fill="#1E4210" opacity="0.4"/>
  <!-- Baumkronen (von oben) -->
  <circle cx="16" cy="16" r="13" fill="#2E6B1A"/>
  <circle cx="16" cy="16" r="10" fill="#357A1E"/>
  <circle cx="16" cy="16" r="6"  fill="#3D8A22"/>
  <circle cx="48" cy="48" r="13" fill="#2E6B1A"/>
  <circle cx="48" cy="48" r="10" fill="#357A1E"/>
  <circle cx="48" cy="48" r="6"  fill="#3D8A22"/>
  <!-- Kleinere Bäume -->
  <circle cx="46" cy="14" r="8" fill="#2A6016"/>
  <circle cx="46" cy="14" r="5" fill="#337020"/>
  <circle cx="18" cy="50" r="8" fill="#2A6016"/>
  <circle cx="18" cy="50" r="5" fill="#337020"/>
  <!-- Bodenpflanzen zwischen Bäumen -->
  <ellipse cx="33" cy="32" rx="4" ry="3" fill="#1E4A0E" opacity="0.8"/>
  <!-- Pilze -->
  <circle cx="36" cy="26" r="2" fill="#CC4422"/>
  <rect x="35" y="26" width="2" height="3" fill="#DDBBAA"/>
</svg>
