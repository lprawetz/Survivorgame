<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Wüste – Sanddünen von oben -->
  <rect width="64" height="64" fill="#D4A84B"/>
  <!-- Dünen-Schattierungen -->
  <ellipse cx="20" cy="20" rx="22" ry="14" fill="#C8982A" opacity="0.5"/>
  <ellipse cx="48" cy="48" rx="20" ry="12" fill="#C8982A" opacity="0.5"/>
  <!-- Dünenkamm-Linien -->
  <path d="M 0 28 Q 16 18 32 26 Q 48 34 64 24" stroke="#B88820" stroke-width="2" fill="none"/>
  <path d="M 0 44 Q 16 36 32 42 Q 48 48 64 40" stroke="#B88820" stroke-width="1.5" fill="none"/>
  <!-- Sandripple-Muster -->
  <path d="M 4  36 Q 12 32 20 36" stroke="#C89830" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M 4  40 Q 12 36 20 40" stroke="#C89830" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M 44 14 Q 52 10 60 14" stroke="#C89830" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M 44 18 Q 52 14 60 18" stroke="#C89830" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Heller Dünenkamm -->
  <path d="M 0 26 Q 16 16 32 24 Q 48 32 64 22" stroke="#EED070" stroke-width="1" fill="none" opacity="0.8"/>
  <!-- Einzelne Steine -->
  <ellipse cx="50" cy="10" rx="4" ry="3" fill="#A8783A"/>
  <ellipse cx="10" cy="54" rx="3" ry="2" fill="#A8783A"/>
  <!-- Trockene Pflanze -->
  <line x1="36" y1="54" x2="36" y2="48" stroke="#886622" stroke-width="1.5"/>
  <line x1="36" y1="50" x2="32" y2="46" stroke="#886622" stroke-width="1"/>
  <line x1="36" y1="50" x2="40" y2="46" stroke="#886622" stroke-width="1"/>
</svg>
