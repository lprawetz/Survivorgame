<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Rusk – Steinwächter aus Kharad -->
  <!-- Massiver Steinleib -->
  <rect x="12" y="30" width="40" height="32" rx="6" fill="#4A3728"/>
  <!-- Basaltplatten-Textur -->
  <rect x="14" y="32" width="17" height="14" rx="2" fill="#5C4535"/>
  <rect x="33" y="32" width="17" height="14" rx="2" fill="#5C4535"/>
  <rect x="14" y="48" width="17" height="12" rx="2" fill="#5C4535"/>
  <rect x="33" y="48" width="17" height="12" rx="2" fill="#5C4535"/>
  <!-- Magma-Risse -->
  <line x1="32" y1="30" x2="32" y2="62" stroke="#FF8800" stroke-width="1.5" opacity="0.8"/>
  <line x1="12" y1="46" x2="52" y2="46" stroke="#FF8800" stroke-width="1.5" opacity="0.8"/>
  <line x1="20" y1="30" x2="14" y2="48" stroke="#FFAA00" stroke-width="1" opacity="0.6"/>
  <line x1="44" y1="30" x2="50" y2="48" stroke="#FFAA00" stroke-width="1" opacity="0.6"/>
  <!-- Breite steinerne Schultern -->
  <rect x="6" y="28" width="14" height="10" rx="3" fill="#3D2E1E"/>
  <rect x="44" y="28" width="14" height="10" rx="3" fill="#3D2E1E"/>
  <!-- Kopf – Steinmaske -->
  <rect x="19" y="12" width="26" height="22" rx="4" fill="#3D2E1E"/>
  <!-- Masken-Details -->
  <rect x="22" y="15" width="8" height="7" rx="2" fill="#1A1008"/>
  <rect x="34" y="15" width="8" height="7" rx="2" fill="#1A1008"/>
  <!-- Magma-Augen -->
  <ellipse cx="26" cy="18" rx="3" ry="3" fill="#FF6600"/>
  <ellipse cx="38" cy="18" rx="3" ry="3" fill="#FF6600"/>
  <ellipse cx="26" cy="18" rx="1.5" ry="1.5" fill="#FFDD00"/>
  <ellipse cx="38" cy="18" rx="1.5" ry="1.5" fill="#FFDD00"/>
  <!-- Masken-Mund (horizontale Linie) -->
  <rect x="23" y="27" width="18" height="3" rx="1" fill="#1A1008"/>
  <!-- Steinige Krone/Hörner -->
  <polygon points="24,12 22,4 28,10" fill="#4A3728"/>
  <polygon points="40,12 42,4 36,10" fill="#4A3728"/>
  <polygon points="32,11 30,3 34,3" fill="#5C4535"/>
</svg>
