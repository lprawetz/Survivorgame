  <ellipse cx="26" cy="24" rx="4" ry="3" fill="#DDAA00"/>
  <ellipse cx="38" cy="24" rx="4" ry="3" fill="#DDAA00"/>
  <ellipse cx="26" cy="24" rx="2" ry="1.5" fill="#FFDD00"/>
  <ellipse cx="38" cy="24" rx="2" ry="1.5" fill="#FFDD00"/>
  <ellipse cx="26" cy="24" rx="1" ry="1"   fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="38" cy="24" rx="1" ry="1"   fill="#FFFFFF" opacity="0.7"/>
