<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Thalira – Wasserwächterin -->
  <!-- Fließendes Gewand unten -->
  <ellipse cx="32" cy="54" rx="16" ry="9" fill="#1A4A6A" opacity="0.85"/>
  <polygon points="16,46 48,46 44,64 20,64" fill="#1E5A80" opacity="0.9"/>
  <!-- Wasserwirbel am Saum -->
  <ellipse cx="24" cy="60" rx="5" ry="3" fill="#3D9ABF" opacity="0.6"/>
  <ellipse cx="40" cy="60" rx="5" ry="3" fill="#3D9ABF" opacity="0.6"/>
  <!-- Oberkörper -->
  <rect x="23" y="30" width="18" height="18" rx="4" fill="#1E6A90"/>
  <!-- Gewand-Schimmer -->
  <ellipse cx="32" cy="39" rx="6" ry="8" fill="#3D9ABF" opacity="0.35"/>
  <!-- Schultern – fließend -->
  <ellipse cx="19" cy="34" rx="7" ry="4" fill="#155070" opacity="0.9"/>
  <ellipse cx="45" cy="34" rx="7" ry="4" fill="#155070" opacity="0.9"/>
  <!-- Kopf -->
  <circle cx="32" cy="21" r="9" fill="#C8DDE8"/>
  <!-- Fließende Haare -->
  <ellipse cx="32" cy="13" rx="11" ry="7" fill="#4488AA"/>
  <ellipse cx="20" cy="19" rx="5" ry="9" fill="#3A7A99" opacity="0.9"/>
  <ellipse cx="44" cy="19" rx="5" ry="9" fill="#3A7A99" opacity="0.9"/>
  <!-- Wasserperlen im Haar -->
  <circle cx="22" cy="13" r="1.5" fill="#AADDEE"/>
  <circle cx="32" cy="9"  r="1.5" fill="#AADDEE"/>
  <circle cx="42" cy="13" r="1.5" fill="#AADDEE"/>
  <!-- Augen – melancholisch, weit -->
  <ellipse cx="28" cy="21" rx="2.5" ry="2" fill="#005577"/>
  <ellipse cx="36" cy="21" rx="2.5" ry="2" fill="#005577"/>
  <ellipse cx="28" cy="21" rx="1"   ry="1" fill="#AADDFF"/>
  <ellipse cx="36" cy="21" rx="1"   ry="1" fill="#AADDFF"/>
  <!-- Heilwasser in den Händen -->
  <ellipse cx="15" cy="40" rx="4" ry="5" fill="#44AACC" opacity="0.7"/>
  <ellipse cx="49" cy="40" rx="4" ry="5" fill="#44AACC" opacity="0.7"/>
  <ellipse cx="15" cy="38" rx="2" ry="3" fill="#AAEEFF" opacity="0.9"/>
  <ellipse cx="49" cy="38" rx="2" ry="3" fill="#AAEEFF" opacity="0.9"/>
</svg>
