<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Morvane – Totensprecher -->
  <!-- Schweres Totengewand -->
  <polygon points="18,30 46,30 50,64 14,64" fill="#110A1E"/>
  <!-- Gewand-Schichten / Sterbetuch -->
  <polygon points="24,30 40,30 43,64 21,64" fill="#1E0F30"/>
  <!-- Knochenzier am Saum -->
  <rect x="18" y="56" width="5" height="8" rx="1" fill="#BBBBAA"/>
  <rect x="27" y="58" width="4" height="6" rx="1" fill="#BBBBAA"/>
  <rect x="35" y="58" width="4" height="6" rx="1" fill="#BBBBAA"/>
  <rect x="43" y="56" width="5" height="8" rx="1" fill="#BBBBAA"/>
  <!-- Körper / Kettengewand -->
  <rect x="22" y="26" width="20" height="18" rx="3" fill="#160A28"/>
  <!-- Metallringe -->
  <circle cx="28" cy="32" r="2" fill="#333322" stroke="#666655" stroke-width="1"/>
  <circle cx="36" cy="32" r="2" fill="#333322" stroke="#666655" stroke-width="1"/>
  <circle cx="32" cy="38" r="2" fill="#333322" stroke="#666655" stroke-width="1"/>
  <!-- Tiefe Kapuze -->
  <ellipse cx="32" cy="16" rx="13" ry="9" fill="#110A1E"/>
  <ellipse cx="32" cy="12" rx="11" ry="7" fill="#0A0514"/>
  <!-- Gesicht im Schatten – nur Augenleuchten -->
  <circle cx="28" cy="18" r="3" fill="#7700AA" opacity="0.9"/>
  <circle cx="36" cy="18" r="3" fill="#7700AA" opacity="0.9"/>
  <circle cx="28" cy="18" r="1.5" fill="#CC44FF"/>
  <circle cx="36" cy="18" r="1.5" fill="#CC44FF"/>
  <!-- Kapuze-Rand -->
  <ellipse cx="32" cy="22" rx="10" ry="4" fill="#110A1E"/>
  <!-- Schattenhände – leuchten lila -->
  <ellipse cx="14" cy="40" rx="5" ry="6" fill="#330055" opacity="0.8"/>
  <ellipse cx="50" cy="40" rx="5" ry="6" fill="#330055" opacity="0.8"/>
  <ellipse cx="14" cy="38" rx="3" ry="4" fill="#8800CC" opacity="0.7"/>
  <ellipse cx="50" cy="38" rx="3" ry="4" fill="#8800CC" opacity="0.7"/>
  <!-- Knochenzeichen auf Brust -->
  <line x1="28" y1="28" x2="36" y2="36" stroke="#AAAAAA" stroke-width="1.5" opacity="0.6"/>
  <line x1="36" y1="28" x2="28" y2="36" stroke="#AAAAAA" stroke-width="1.5" opacity="0.6"/>
</svg>
